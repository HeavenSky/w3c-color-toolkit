name: CI

# 推送 main, 提 PR 或手动触发时跑全部校验与打包, 只上传 vsix 作为 artifact, 不创建 GitHub Release, 也不发布到任何市场.
# release.yml 不重复校验, 而是等同一提交在 main 上的本工作流(push 触发)通过才发布; 改文件名要同步改它的 Wait for CI.
on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# 同一分支或 PR 的新推送取消尚未跑完的旧运行.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # 仓库在 tools/ 下有 Python 脚本时才装 uv: 插件专属门禁(scripts/check-extra.mjs)可能经 `uv run`
            # 调用它们. 没装 uv 时那类门禁只能跳过, 等于发布前少了一道检查.
            # setup-uv 不发布 v10 这类浮动大版本标签, 只能钉到完整版本号; 写成 @v10 会在 Set up job 阶段解析失败.
            - name: Set up uv
              if: hashFiles('tools/**/*.py') != ''
              uses: astral-sh/setup-uv@v10.2.0

            # 图标产物, 清单占位符, 本地化与各仓库专属规则; 漏了不会让构建失败, 只会静默出错.
            - name: Check consistency
              run: npm run check

            - name: Typecheck
              run: npm run typecheck

            # oxlint 与 oxfmt 只检查不修复; 本地用 npm run lint 与 npm run fmt 修复.
            - name: Lint
              run: npm run lint:check

            - name: Format check
              run: npm run fmt:check

            - name: Test
              run: npm test

            # package 脚本内部触发 vscode:prepublish 做生产构建, 并按允许清单断言 VSIX 内容.
            - name: Package extension
              run: npm run package

            - uses: actions/upload-artifact@v7
              with:
                  name: vsix
                  path: artifacts/*.vsix
