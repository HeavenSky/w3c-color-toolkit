name: CI

# 推送 main, 提 PR 或手动触发时跑与 release.yml 相同的校验与打包, 只上传 vsix 作为 artifact,
# 不创建 GitHub Release, 也不发布到任何市场. 发布仍只走 release.yml(打 v* 标签).
# 推送的提交已带 v* 标签时跳过校验: 发版时 main 与标签一起推会同时触发本文件与 release.yml,
# 后者本就跑同样的校验, 这里不再重复跑一遍.
on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# 同一分支或 PR 的新推送取消尚未跑完的旧运行.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # 只对 push 判断; PR 与手动触发总是跑. checkout 留下的凭据让 ls-remote 在私有仓库也能用.
    # ls-remote 对附注标签额外输出 ^{} 解引用行, 其哈希就是提交本身, 因此两种标签都能匹配.
    gate:
        runs-on: ubuntu-latest
        outputs:
            tagged: ${{ steps.tag.outputs.tagged }}
        steps:
            - uses: actions/checkout@v7
              if: github.event_name == 'push'

            - name: Check release tag on this commit
              id: tag
              if: github.event_name == 'push'
              run: |
                  if git ls-remote --tags origin 'refs/tags/v*' | grep -q "^$GITHUB_SHA"; then
                    echo "::notice::$GITHUB_SHA 已带 v* 标签, 校验交给 Release 工作流"
                    echo "tagged=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "tagged=false" >> "$GITHUB_OUTPUT"
                  fi

    check:
        needs: gate
        if: needs.gate.outputs.tagged != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Set up uv
              if: hashFiles('tools/**/*.py') != ''
              uses: astral-sh/setup-uv@v10.2.0

            - name: Check consistency
              run: npm run check

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint:check

            - name: Format check
              run: npm run fmt:check

            - name: Test
              run: npm test

            - name: Package extension
              run: npm run package

            - uses: actions/upload-artifact@v7
              with:
                  name: vsix
                  path: artifacts/*.vsix
